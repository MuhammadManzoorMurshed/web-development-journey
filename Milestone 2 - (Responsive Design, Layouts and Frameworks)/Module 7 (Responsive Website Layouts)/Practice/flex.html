<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout</title>

    <style>
        .container {
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid black;
            gap: 5px;
            border-radius: 10px;
            padding: 5px;
            height: 50vh;
        }

        .left, .right {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            border-radius: 10px;
        }

        .left {
            background-color: grey;
            width: 30%;
        }

        .right {
            background-color: beige;
            width: 70%;
        }

        @media screen and (max-width: 575px) {
            .container {
                flex-direction: column;
                height: 50vh;
            }

            .left, .right {
                width: 100%;
            }

            .left {
                height: 30vh;
            }

            .right {
                height: 70vh;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="left">
            Left
        </div>
        <div class="right">
            Right
        </div>
    </div>
</body>
</html>
