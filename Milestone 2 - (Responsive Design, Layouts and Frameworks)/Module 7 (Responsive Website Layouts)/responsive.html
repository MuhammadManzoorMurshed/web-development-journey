<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Website</title>
    <style>
        body {
            border: 1px solid skyblue;
            max-width: 1140px;
            margin: 0 auto;
        }

        .image_container {
            display: flex;
        }

        .image_container div {
            width: 50%;
        }

        .image_container img {
            width: 100%;
        }

        @media screen and (max-width: 576px) {
            .image_container {
                flex-direction: column-reverse;
            }

            .image_container div {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Responsive Website</h1>
        <ol>
            <li>Viewport Meta Tag</li>
            <li>CSS Relative Units</li>
            <li>Body Max Width and Horizontal Center Align</li>
            <li>Image Fluid</li>
            <li>Two Column and Use Media Query With Flex Direction Column</li>
            <li>Multi Column: Grid Layout</li>
            <li>Menu Responsive: Will Need JavaScript</li>
        </ol>
    </header>

    <main>
        <div class="image_container">
            <div>
                <img src="images/food.jpg" alt="">
            </div>
            <div>
                <img src="images/tiger.jpg" alt="">
            </div>
        </div>
    </main>
</body>
</html>
