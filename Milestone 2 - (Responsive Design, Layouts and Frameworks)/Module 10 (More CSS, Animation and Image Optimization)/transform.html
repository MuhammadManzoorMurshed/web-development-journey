<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transform</title>
    <style>
        body {
            margin-left: 50px;
        }

        .container, .inner {
            width: 200px;
            height: 200px;
        }

        .container {
            border: 2px solid steelblue;
            background-color: aquamarine;
            transform: scale(100%);
        }

        .inner {
            border: 2px solid slateblue;
            background-color: palegoldenrod;
            /*display: none;*/
            transform: scale(75%) rotate(60deg) translateY(30%) translateX(-20px);
        }
    </style>
</head>
<body>
    <h2>Explore Transform and Translate</h2>

    <div class="container">
        <div class="inner">Inner 1</div>
    </div>
    <div class="container">
        <div class="inner">Inner 2</div>
    </div>
    <div class="container">
        <div class="inner">Inner 3</div>
    </div>
</body>
</html>
