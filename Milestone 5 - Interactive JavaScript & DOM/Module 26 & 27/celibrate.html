<!DOCTYPE html>
<html lang="bn">

<head>
    <meta charset="UTF-8">
    <title>Happy Acquaintance Day</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        body {
            background: radial-gradient(circle at top, #1b263b, #000814);
            color: #f9fafb;
            overflow: hidden;
        }

        .scene {
            height: 100%;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .effects-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .gift-wrapper {
            position: relative;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 1rem;
        }

        .gift-box {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 22px 45px rgba(0, 0, 0, 0.6);
            position: relative;
            transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s;
            text-align: center;
            padding: 12px;
        }

        .gift-box span.label {
            font-size: 22px;
            font-weight: 700;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.7);
        }

        .gift-box.red {
            background: linear-gradient(135deg, #ff4b5c, #b31217);
        }

        .gift-box.yellow {
            background: linear-gradient(135deg, #ffd447, #f7a800);
        }

        .gift-box.green {
            background: linear-gradient(135deg, #34d399, #059669);
        }

        .gift-box::before {
            content: "";
            position: absolute;
            inset: 16%;
            border-radius: inherit;
            border: 4px solid rgba(255, 255, 255, 0.55);
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.5);
        }

        .gift-box:hover {
            transform: translateY(-4px) scale(1.04);
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.8);
        }

        .gift-box:active {
            transform: translateY(2px) scale(0.97);
        }

        .hidden {
            display: none;
        }

        .hint-text {
            font-size: 14px;
            opacity: 0.85;
        }

        .particle {
            position: absolute;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            opacity: 0;
            animation: explode 5000ms ease-out forwards;
        }

        @keyframes explode {
            0% {
                transform: translate(0, 0) scale(0.3);
                opacity: 1;
            }

            70% {
                opacity: 1;
            }

            100% {
                transform: translate(var(--dx), var(--dy)) scale(0.1);
                opacity: 0;
            }
        }

        .floating-text {
            position: absolute;
            font-size: 22px;
            font-weight: 700;
            color: #fefce8;
            white-space: nowrap;
            text-shadow: 0 3px 8px rgba(0, 0, 0, 0.8);
            animation: flyOut 3s ease-out forwards;
        }

        @keyframes flyOut {
            0% {
                transform: translate(-50%, -50%) translate(0, 0);
                opacity: 0;
            }

            20% {
                opacity: 1;
            }

            100% {
                transform: translate(-50%, -50%) translate(var(--tx), var(--ty));
                opacity: 0;
            }
        }

        .floating-emoji {
            position: absolute;
            font-size: 30px;
            animation: emojiFly 3.3s ease-out forwards;
            text-shadow: 0 3px 8px rgba(0, 0, 0, 0.8);
        }

        @keyframes emojiFly {
            0% {
                transform: translate(-50%, -50%) translate(0, 0) scale(0.6);
                opacity: 0;
            }

            15% {
                opacity: 1;
            }

            100% {
                transform: translate(-50%, -50%) translate(var(--tx), var(--ty)) scale(1.1);
                opacity: 0;
            }
        }

        .title {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            font-size: 20px;
            opacity: 0.9;
        }

        .couple-emoji {
            font-size: 60px;
            text-shadow: 0 5px 15px rgba(0, 0, 0, 0.7);
            animation: float 3s ease-in-out infinite;
            margin-top: 20px;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }
    </style>
</head>

<body>
    <div class="scene">
        <div class="title">
            
        </div>

        <div id="particle-layer" class="effects-layer"></div>
        <div id="floating-layer" class="effects-layer"></div>

        <div class="gift-wrapper">
            <div id="gift1" class="gift-box red">
                <span class="label">💚</span>
            </div>

            <div id="gift2" class="gift-box yellow hidden">
                <span class="label">💛</span>
            </div>

            <div id="gift3" class="gift-box green hidden">
                <span class="label">❤️</span>
            </div>

            <div id="hint" class="hint-text">

            </div>
        </div>
    </div>

    <script>
        const particleLayer = document.getElementById("particle-layer");
        const floatingLayer = document.getElementById("floating-layer");

        const gift1 = document.getElementById("gift1");
        const gift2 = document.getElementById("gift2");
        const gift3 = document.getElementById("gift3");
        const hint = document.getElementById("hint");
        const giftWrapper = document.querySelector('.gift-wrapper');

        let loop = null;

        function stopLoop() {
            if (loop) clearInterval(loop);
            loop = null;
        }

        function createFireworksBurstAcrossScreen() {
            const w = window.innerWidth;
            const h = window.innerHeight;

            const bursts = 6;
            for (let i = 0; i < bursts; i++) {
                const x = (w * (0.15 + 0.7 * Math.random()));
                const y = (h * (0.15 + 0.7 * Math.random()));
                createFireworks(x, y);
            }
        }

        function createFireworks(centerX, centerY) {
            const total = 36;
            for (let i = 0; i < total; i++) {
                const p = document.createElement("div");
                p.className = "particle";

                const angle = (Math.PI * 2 * i) / total;
                const distance = 70 + Math.random() * 110;
                const dx = Math.cos(angle) * distance;
                const dy = Math.sin(angle) * distance;

                const colors = ["#ff6b6b", "#ffbe0b", "#3dd5f3", "#9d4edd", "#34d399", "#f97316"];

                p.style.background = colors[Math.floor(Math.random() * colors.length)];
                p.style.left = centerX + "px";
                p.style.top = centerY + "px";
                p.style.setProperty("--dx", dx + "px");
                p.style.setProperty("--dy", dy + "px");

                particleLayer.appendChild(p);
                p.addEventListener("animationend", () => p.remove());
            }
        }

        function createDirectionalTexts(message, fromElement) {
            const rect = fromElement.getBoundingClientRect();
            const startX = rect.left + rect.width / 2;
            const startY = rect.top + rect.height / 2;

            const w = window.innerWidth;
            const h = window.innerHeight;

            const targets = [
                { x: w / 2, y: 40 },
                { x: w - 40, y: 40 },
                { x: w - 40, y: h / 2 },
                { x: w - 40, y: h - 40 },
                { x: w / 2, y: h - 40 },
                { x: 40, y: h - 40 },
                { x: 40, y: h / 2 },
                { x: 40, y: 40 }
            ];

            targets.forEach((t) => {
                const el = document.createElement("div");
                el.className = "floating-text";
                el.textContent = message;

                el.style.left = "50%";
                el.style.top = "50%";
                el.style.transformOrigin = "center";

                const dx = t.x - (w / 2);
                const dy = t.y - (h / 2);
                el.style.setProperty("--tx", dx + "px");
                el.style.setProperty("--ty", dy + "px");

                floatingLayer.appendChild(el);
                el.addEventListener("animationend", () => el.remove());
            });
        }

        function createEmojiBurst(fromElement, emojis, count = 28) {
            const rect = fromElement.getBoundingClientRect();
            const startX = rect.left + rect.width / 2;
            const startY = rect.top + rect.height / 2;

            for (let i = 0; i < count; i++) {
                const el = document.createElement("div");
                el.className = "floating-emoji";
                el.textContent = emojis[Math.floor(Math.random() * emojis.length)];

                el.style.left = "50%";
                el.style.top = "50%";
                el.style.transformOrigin = "center";

                const angle = Math.random() * Math.PI * 2;
                const dist = 150 + Math.random() * 200;
                const dx = Math.cos(angle) * dist;
                const dy = Math.sin(angle) * dist;

                el.style.setProperty("--tx", dx + "px");
                el.style.setProperty("--ty", dy + "px");

                floatingLayer.appendChild(el);
                el.addEventListener("animationend", () => el.remove());
            }
        }

        gift1.addEventListener("click", () => {


            stopLoop();

            createFireworksBurstAcrossScreen();
            createDirectionalTexts("শুভ পরিচয় দিবস।", gift1);

            loop = setInterval(() => {
                createFireworksBurstAcrossScreen();
                createDirectionalTexts("শুভ পরিচয় দিবস।", gift1);
            }, 1600);

            gift1.classList.add("hidden");
            gift2.classList.remove("hidden");
            hint.textContent = "";
        });


        gift2.addEventListener("click", () => {

            stopLoop();

            createEmojiBurst(gift2, ["😍", "🥰", "🤍", "😻", "😘"], 30);
            createDirectionalTexts("আমার জীবনে আসার জন্য অশেষ শুকরিয়া।", gift2);

            loop = setInterval(() => {
                createEmojiBurst(gift2, ["😍", "🥰", "🤍", "😻", "😘"], 30);
                createDirectionalTexts("আমার জীবনে আসার জন্য অশেষ শুকরিয়া।", gift2);
            }, 1600);

            gift2.classList.add("hidden");
            gift3.classList.remove("hidden");
            hint.textContent = "";
        });

        gift3.addEventListener("click", () => {

            stopLoop();

            createEmojiBurst(gift3, ["❤️", "💖", "💕", "💞", "💓", "💗"], 34);
            createDirectionalTexts("ভালোবাসি তোমাকে।", gift3);

            loop = setInterval(() => {
                createEmojiBurst(gift3, ["❤️", "💖", "💕", "💞", "💓", "💗"], 34);
                createDirectionalTexts("ভালোবাসি তোমাকে।", gift3);
            }, 1600);

            hint.textContent = "";

            gift3.style.display = "none";

            const coupleEmoji = document.createElement("div");
            coupleEmoji.className = "couple-emoji";
            coupleEmoji.innerHTML = "👩‍❤️‍👨";
            giftWrapper.appendChild(coupleEmoji);
        });
    </script>
</body>

</html>
