<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM <Summary></Summary></title>
</head>
<body>
    <h1>DOM Events Summary</h1>

    <input type="text" name="" id="name-input" placeholder="Your Name">
    <button onclick="addName()">Add Name</button>
    <button id="btn-add-name">Add Name 1</button>

    <div id="name-container">

    </div>

    <div>

    </div>

    <script>
        function addName () {
            const nameInput = document.getElementById('name-input');
            const newName = nameInput.value;
            
            // Parent
            const nameContainer = document.getElementById('name-container');

            // Create p
            const p = document.createElement('p');
            p.innerText = newName;

            // Append
            nameContainer.appendChild(p);

            nameInput.value = '';
        }

        // add event listener
        document.getElementById('btn-add-name')
        .addEventListener('click', function () {
            
        })
    </script>
</body>
</html>
